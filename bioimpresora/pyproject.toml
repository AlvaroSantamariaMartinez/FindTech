[project]
name = "biosim"
version = "0.1.0"
description = "Simulador y aprendizaje profundo para bioimpresora de órganos biomiméticos"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
biosim = "biosim.cli:main"

[tool.setuptools.packages.find]
include = ["biosim*"]
